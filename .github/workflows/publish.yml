name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Verify release identity
        run: node scripts/check-release.mjs
      - name: Build the npm tarball
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Publish to npm with OIDC
        run: |
          version=$(node -p "require('./package.json').version")
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          npm publish "$RUNNER_TEMP/gitlab-index-$version.tgz" --access public --tag "$dist_tag"
      - name: Create GitHub release and attach the published tarball
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/gitlab-index-$version.tgz" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${prerelease[@]}"
